<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbolo Foot - Bientôt Disponible</title>
    
    <!-- Importation de la police Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fafbfc;
            --text-dark: #0f2e20;
            --accent-green: #00a859;
            --gabon-yellow: #FCD116;
            --gabon-blue: #3A75C4;
            --text-gray: #5a5a5a;
        }

        /* Fin liseré tricolore Gabon en haut de page */
        .flag-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            display: flex;
            z-index: 30;
        }
        .flag-bar span { flex: 1; }
        .flag-bar .g { background: var(--accent-green); }
        .flag-bar .y { background: var(--gabon-yellow); }
        .flag-bar .b { background: var(--gabon-blue); }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Syne', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 0.88fr 1.12fr;
            align-items: center;
            gap: 30px;
            position: relative;
            z-index: 1;
        }

        /* --- PARTIE GAUCHE (TEXTE) --- */
        .text-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 20px;
        }

        /* "Bientôt" au dessus du logo */
        .coming-soon-title {
            font-family: 'Syne', sans-serif;
            font-size: 4.5rem;
            font-weight: 800;
            font-style: italic;
            color: var(--accent-green);
            line-height: 0.9;
            margin-top: -8px;
            margin-bottom: 70px; /* ÉCART AJOUTÉ ICI pour ne pas coller au logo */
            letter-spacing: -2px;
        }

        /* Logo en haut */
        .brand-logo {
            margin-bottom: 30px;
            margin-top: 10px; /* Petit écart supplémentaire au dessus */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo .logo-mark {
            height: 64px;
            width: auto;
        }

        .brand-logo .logo-wordmark {
            height: 28px;
            width: auto;
        }

        /* Titre principal sous le logo */
        h1 {
            font-size: 3.3rem;
            line-height: 1.1;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        h1 .highlight {
            color: var(--accent-green);
            font-style: italic;
            font-weight: 800;
            position: relative;
            display: inline-block;
        }

        h1 .highlight::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: rgba(0, 168, 89, 0.2);
            z-index: -1;
            border-radius: 4px;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-gray);
            line-height: 1.6;
            max-width: 480px;
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* Indicateur de statut */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dark);
            font-weight: 700;
            border-left: 4px solid var(--accent-green);
            padding-left: 20px;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 168, 89, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 168, 89, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 168, 89, 0); }
        }

        /* --- PARTIE DROITE (MAQUETTE) --- */
        .visual-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mockup-trigger {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: zoom-in;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }
        .mockup-trigger:hover { transform: scale(1.015); }
        .mockup-trigger:focus-visible {
            outline: 3px solid var(--accent-green);
            outline-offset: 10px;
            border-radius: 14px;
        }

        .visual-content .mockup-image {
            width: auto;
            max-width: 120%;
            max-height: 96vh;
            object-fit: contain;
            filter: drop-shadow(0 50px 70px rgba(0, 0, 0, 0.22));
        }

        /* Zoom plein écran au clic sur la maquette */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 12, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            z-index: 50;
            cursor: zoom-out;
        }
        .lightbox[hidden] { display: none; }
        .lightbox img {
            max-width: min(90vw, 480px);
            max-height: 92vh;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 40px 70px rgba(0, 0, 0, 0.5));
        }

        /* LE BALLON EN BAS À DROITE (PARTIELLEMENT COUPÉ) */
        .corner-ball {
            position: fixed;
            bottom: -40px;
            right: -40px;
            width: 200px;
            height: auto;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        /* Responsive Mobile */
        @media (max-width: 950px) {
            body {
                height: auto;
                padding: 40px 0;
                overflow-y: auto;
            }
            .container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 40px;
                width: 90%;
            }
            .coming-soon-title {
                font-size: 3.5rem;
                margin-bottom: 30px; /* Écart réduit sur mobile */
            }
            h1 {
                font-size: 2.2rem;
            }
            p {
                margin: 0 auto 30px auto;
            }
            .text-content {
                padding-left: 0;
            }
            .status-badge {
                justify-content: center;
                border-left: none;
                border-bottom: 3px solid var(--accent-green);
                padding-bottom: 8px;
                padding-left: 0;
            }
            .corner-ball {
                display: none;
            }
            .visual-content .mockup-image {
                max-height: 55vh;
            }
        }
    </style>
</head>
<body>

    <!-- Liseré tricolore Gabon -->
    <div class="flag-bar"><span class="g"></span><span class="y"></span><span class="b"></span></div>

    <!-- LE BALLON EN BAS À DROITE (PARTIELLEMENT CACHÉ) -->
    <img src="https://cdn-icons-png.flaticon.com/512/53/53283.png" alt="Ballon" class="corner-ball">

    <div class="container">
        
        <!-- COLONNE GAUCHE : TEXTE -->
        <div class="text-content">
            
            <!-- "Bientôt" géant au dessus de tout -->
            <div class="coming-soon-title">Bientôt ...</div>

            <!-- Logo Mbolo Foot -->
            <div class="brand-logo">
                <img src="assets/logo-mark.png" alt="" class="logo-mark">
                <img src="assets/logo-wordmark.png" alt="Mbolo Foot" class="logo-wordmark">
            </div>

            <!-- Texte principal sous le logo -->
            <h1>Le football gabonais,<br>connecté d'un bout à <span class="highlight">l'autre.</span></h1>

            <p>
                Nous préparons une nouvelle expérience pour vous connecter aux différents championnats nationaux gabonais comme jamais auparavant.
            </p>

        </div>

        <!-- COLONNE DROITE : MAQUETTE -->
        <div class="visual-content">
            <button type="button" class="mockup-trigger" id="mockup-trigger" aria-label="Agrandir l'aperçu de l'application">
                <img src="assets/maquette-mobile.png" alt="Aperçu de l'application Mbolo Foot" class="mockup-image">
            </button>
        </div>

    </div>

    <!-- Zoom plein écran de la maquette -->
    <div class="lightbox" id="lightbox" hidden>
        <img src="assets/maquette-mobile.png" alt="Aperçu de l'application Mbolo Foot">
    </div>

    <script>
        (function () {
            var trigger = document.getElementById('mockup-trigger');
            var lightbox = document.getElementById('lightbox');
            if (!trigger || !lightbox) return;

            function open() { lightbox.hidden = false; }
            function close() { lightbox.hidden = true; }

            trigger.addEventListener('click', open);
            lightbox.addEventListener('click', close);
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') close();
            });
        })();
    </script>
</body>
</html>
